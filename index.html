<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOK – Winterwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Encode+Sans:wght@400;500&family=Inter:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="icon menu" aria-label="Menu"><svg width="26" height="16" viewBox="0 0 26 16" fill="none" stroke="#292526" stroke-width="1.5" stroke-linecap="round"><path d="M13 1h12M7 8h18M2 15h23"/></svg></button>
  <a class="logo" href="#" aria-label="LOOK home"><img src="assets/logo.png" alt="" onerror="this.remove()"><span>LOOK</span></a>
  <nav class="nav" aria-label="Primary"><a href="#">Men</a><a href="#">Women</a><a href="#">Kids</a><a href="#">Home</a></nav>
  <label class="search desk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cac9c9" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Search</span><input type="search" placeholder="Search"></label>
  <div class="tools">
    <button class="tool srch" aria-label="Search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#292526" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#292526" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg><b>Profile</b></button>
    <button class="tool"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#292526" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0112 7.3a4.3 4.3 0 017.5 2.5C19.5 15.4 12 20 12 20z"/></svg><b>Wishlist</b></button>
    <button class="tool cart" id="cartBtn" aria-label="Cart, 0 items"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#292526" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg><b>Cart</b><i class="badge" id="badge" aria-hidden="true">0</i></button>
  </div>
  <div class="finder">
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cac9c9" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Search</span><input type="search" placeholder="Search clothes. . ."></label>
    <button class="filter" aria-label="Filters"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fdfdfd" stroke-width="1.5" stroke-linecap="round"><path d="M3 7h9M16 7h5M3 17h5M12 17h9"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</header>
<div class="chips" role="group" aria-label="Category">
  <button class="chip on" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>All Items</button>
  <button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M9 3l3 3 3-3 2 6-2 2 3 10H6l3-10-2-2z"/></svg>Dress</button>
  <button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 4l-5 3 2 5 3-1v9h8v-9l3 1 2-5-5-3a4 4 0 01-8 0z"/></svg>T-Shirt</button>
  <button class="chip" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 3h10l1 18h-5l-1-9-1 9H6z"/></svg>Jeans</button>
</div>
<main><div class="grid" id="grid"></div></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-head"><h2 id="sheetTitle">SELECT SIZE</h2><a href="#">Size Chart</a></div>
  <div class="sizes" id="sizes" role="radiogroup" aria-label="Size"></div>
  <div class="sheet-foot"><button class="done" id="done" disabled>Done</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
